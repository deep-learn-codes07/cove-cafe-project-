<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b0f" />
<title>Sign In — Cove cafe</title>
<meta name="description" content="Sign in to Cove cafe with email, Google, or phone." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@latest/font/lucide.css">
<link rel="stylesheet" href="./css/styles.css" />
</head>
<body class="auth-page">
<div class="bg-grain" aria-hidden="true"></div>
<header class="nav glass">
  <link rel="canonical" href="/menu.html" />
npm install -g firebase-tools
firebase emulators:start --only hosting
  <a class="brand" href="./index.html">
    <span class="brand-mark"><img src="./assets/logo/logo.svg" alt="Cove cafe logo" /></span>
    <span class="brand-name">Cove <em>cafe</em></span>
  </a>
  <nav>
    <a href="./signup.html" class="btn btn-ghost">Sign up</a>
  </nav>
</header>

<section class="auth-wrap">
  <div class="auth-card glass">
    <h1>Sign in</h1>
    <p class="muted">Choose your preferred sign in method.</p>

    <form id="signInForm" class="form">
      <label>Email<input type="email" id="signInEmail" placeholder="you@example.com" required/></label>
      <label>Password<input type="password" id="signInPassword" placeholder="••••••••" required/></label>
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>

    <div class="divider"><span>or</span></div>

    <button id="googleSignIn" class="btn btn-outline" type="button">
      <i class="i-github"></i> Continue with Google
    </button>

    <form id="phoneForm" class="form">
      <label>Phone number<input type="tel" id="signInPhone" placeholder="+91 98765 43210" pattern="\+\d{10,15}" required/></label>
      <button class="btn btn-primary" type="submit">Send OTP</button>
    </form>

    <p class="muted">New here? <a href="./signup.html">Create an account</a>.</p>
    <p id="authErr" class="err" hidden></p>
    <p id="authInfo" class="muted" hidden></p>
  </div>
</section>

<script type="module" src="./js/auth.js"></script>
</body>
</html>
