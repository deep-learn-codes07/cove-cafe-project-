<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b0f" />
<title>Cove cafe — Premium Digital Menu</title>
<meta name="description" content="Cove cafe — a premium digital menu featuring coffee, tea, desserts, pizza and more. Scan, browse and order from your phone." />
<link rel="canonical" href="/" />
<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:title" content="Cove cafe — Premium Digital Menu" />
<meta property="og:description" content="Browse our full cafe menu with bestsellers, prices and photos." />
<meta property="og:image" content="/assets/og-cover.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@latest/font/lucide.css">
<link rel="stylesheet" href="./css/styles.css" />
<!-- Structured data -->
<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"CafeOrCoffeeShop",
  "name":"Cove cafe",
  "image":"/assets/og-cover.jpg",
  "telephone":"+91-7506420904",
 
  "address":{"@type":"PostalAddress","streetAddress":"12 Brew Lane","addressLocality":"Mumbai","addressCountry":"IN"},
  "servesCuisine":["Coffee","Italian","Desserts"],
  "openingHours":"Mo-Su 08:00-23:00"
}
</script>
</head>
<body class="home">

<!-- Background glow -->
<div class="bg-grain" aria-hidden="true"></div>
<div class="bg-orb orb-a" aria-hidden="true"></div>
<div class="bg-orb orb-b" aria-hidden="true"></div>

<main>
  <section class="hero">
    <div class="hero-bg">
      <video class="bg-video" autoplay muted loop playsinline aria-hidden="true">
        <source src="./assets/background.mp4" type="video/mp4">
      </video>
      <div class="bg-video-overlay" aria-hidden="true"></div>
    </div>
    <div class="hero-inner">
      <div class="logo-ring">
        <div class="logo"><img src="./assets/logo/covelogo.png" alt="Cove cafe logo" /></div>
      </div>
      <h1 class="display">Cove <em>cafe</em></h1>
      <p class="tagline">Slow-brewed coffee, hand-crafted plates, and late-night desserts — served in a candle-lit room since 2014.</p>

      <div id="statusPill" class="status-pill">
        <span class="dot"></span><span id="statusText">Checking hours…</span>
      </div>

      <div class="cta-row">
        <a class="btn btn-primary" href="./menu.html"><i class="i-book-open"></i> View Menu</a>
      </div>

      <div class="socials">
        <a aria-label="Instagram" target="_blank" rel="noopener" href="https://instagram.com"><i class="i-instagram"></i></a>
        <a aria-label="Facebook"  target="_blank" rel="noopener" href="https://facebook.com"><i class="i-facebook"></i></a>
        <a aria-label="WhatsApp"  target="_blank" rel="noopener" href="https://wa.me/917506420904"><i class="i-message-circle"></i></a>
        <button id="shareBtn" aria-label="Share menu"><i class="i-share-2"></i></button>
        <button id="qrBtn" aria-label="Show QR"><i class="i-qr-code"></i></button>
      </div>
    </div>
  </section>

  <section class="featured">
    <h2 class="section-title">Today's Favourites</h2>
    <div id="featuredGrid" class="featured-grid">
      <!-- skeletons -->
      <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
    </div>
  </section>
</main>

<!-- Floating actions -->
<div class="fab-stack">
  <a class="fab fab-wa" href="https://wa.me/+917219826169?text=Hi%20Cove%20cafe%2C%20I%27d%20like%20to%20order" target="_blank" rel="noopener" aria-label="Order on WhatsApp"><i class="i-message-circle"></i></a>
</div>

<!-- QR modal -->
<div id="qrModal" class="modal" hidden>
  <div class="modal-card glass">
    <button class="modal-close" data-close aria-label="Close"><i class="i-x"></i></button>
    <h3>Scan to open menu</h3>
    <div id="qrCanvas" class="qr-canvas"></div>
    <p class="muted" id="qrUrl"></p>
  </div>
</div>

<footer class="foot">
  <p>© <span id="yr"></span> Cove cafe · Crafted with care</p>
</footer>

<script type="module" src="./js/supabase.js"></script>
<script type="module" src="./js/home.js"></script>
</body>
</html>
