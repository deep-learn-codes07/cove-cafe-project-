<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b0f" />
<title>Menu — Cove cafe</title>
<meta name="description" content="Full menu — coffee, tea, cold beverages, mocktails, desserts, burgers, pizza, pasta, sandwiches and snacks." />
<link rel="canonical" href="/menu.html" />
<meta property="og:title" content="Menu — Cove cafe" />
<meta property="og:description" content="Browse our complete cafe menu with photos, descriptions and prices." />
<meta property="og:image" content="/assets/og-cover.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@latest/font/lucide.css">
<link rel="stylesheet" href="./css/styles.css" />
</head>
<body class="menu-page menu-locked">
<div class="bg-grain" aria-hidden="true"></div>
<div class="bg-orb orb-a" aria-hidden="true"></div>
<div class="bg-orb orb-b" aria-hidden="true"></div>

<header class="nav glass">
  <a class="brand" href="./index.html">
    <span class="brand-mark"><img src="./assets/logo/logo.svg" alt="Cove cafe logo" /></span>
    <span class="brand-name">Cove <em>cafe</em></span>
  </a>
  <nav>
    <a href="./index.html" class="btn btn-ghost"><i class="i-arrow-left"></i> Home</a>
  </nav>
</header>

<section class="menu-banner">
  <div class="banner-inner">
    <h1 class="display">The Menu</h1>
    <p class="tagline">Tap any dish to see ingredients and allergens.</p>
    <div class="banner-actions">
      <div class="search-wrap glass">
        <i class="i-search"></i>
        <input id="searchInput" type="search" placeholder="Search by name, category, description…" autocomplete="off"/>
        <button id="clearSearch" hidden aria-label="Clear"><i class="i-x"></i></button>
      </div>
    </div>
    <div class="cat-tabs-wrap">
      <div id="catTabs" class="cat-tabs"></div>
    </div>
  </div>
</section>

<main id="menuMain" class="menu-main">
  <div class="skeleton-grid">
    <div class="skeleton-card"></div><div class="skeleton-card"></div>
    <div class="skeleton-card"></div><div class="skeleton-card"></div>
  </div>
</main>

<div class="fab-stack">
  <a class="fab fab-wa" href="https://wa.me/+917219826169?text=Hi%20Cove%20cafe%2C%20I%27d%20like%20to%20order" target="_blank" rel="noopener" aria-label="Order on WhatsApp"><i class="i-message-circle"></i></a>
</div>

<!-- Required login gate -->
<div id="authGate" class="modal auth-gate" hidden>
  <div class="modal-card glass auth-gate-card">
    <div class="auth-gate-brand">
      <div class="auth-logo"><img src="./assets/logo/logo.svg" alt="Cove cafe logo" /></div>
      <div>
        <span>Cove cafe</span>
        <small>Member access</small>
      </div>
    </div>

    <h2 id="authGateTitle">Login required</h2>
    <p class="muted" id="authGateText">Please sign in to access the Cove cafe menu.</p>

    <div class="auth-mode-tabs" role="tablist" aria-label="Login options">
      <button id="popupSignInTab" class="active" type="button">Sign in</button>
      <button id="popupSignUpTab" type="button">Create account</button>
    </div>

    <form id="popupSignInForm" class="form auth-gate-form">
      <label>Email<input type="email" id="popupSignInEmail" placeholder="you@example.com" autocomplete="email" required /></label>
      <label>Password<input type="password" id="popupSignInPassword" placeholder="Password" autocomplete="current-password" required /></label>
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>

    <form id="popupSignUpForm" class="form auth-gate-form" hidden>
      <label>Full name<input type="text" id="popupSignUpName" placeholder="Jane Doe" autocomplete="name" required /></label>
      <label>Email<input type="email" id="popupSignUpEmail" placeholder="you@example.com" autocomplete="email" required /></label>
      <label>Password<input type="password" id="popupSignUpPassword" placeholder="Password" autocomplete="new-password" required /></label>
      <label>Phone number<input type="tel" id="popupSignUpPhone" placeholder="9000000000" pattern="\d{10}" inputmode="numeric" maxlength="10" autocomplete="tel" /></label>
      <button class="btn btn-primary" type="submit">Create account</button>
    </form>

    <div class="auth-divider"><span>or</span></div>
    <button id="popupGoogleAuth" class="btn btn-outline" type="button"><i class="i-chrome"></i> Continue with Google</button>
    <p id="popupAuthErr" class="err" hidden></p>
    <p id="popupAuthInfo" class="muted" hidden></p>
  </div>
</div>

<!-- Item modal -->
<div id="itemModal" class="modal" hidden>
  <div class="modal-card glass item-modal">
    <button class="modal-close" data-close aria-label="Close"><i class="i-x"></i></button>
    <div class="item-hero">
      <img id="mImg" alt="" loading="lazy"/>
    </div>
    <div class="item-body">
      <div class="row-between">
        <h3 id="mName"></h3>
        <span id="mPrice" class="price"></span>
      </div>
      <div id="mBadges" class="badges"></div>
      <p id="mDesc" class="muted"></p>
      <div class="kv"><span>Ingredients</span><p id="mIng"></p></div>
      <div class="kv"><span>Allergens</span><p id="mAll"></p></div>
      <div class="item-cta">
        <a id="mOrder" class="btn btn-primary" target="_blank" rel="noopener"><i class="i-message-circle"></i> Order on WhatsApp</a>
      </div>
    </div>
  </div>
</div>

<footer class="foot"><p>© <span id="yr"></span> Cove cafe</p></footer>

<script type="module" src="./js/supabase.js"></script>
<script type="module" src="./js/menu.js"></script>
</body>
</html>
