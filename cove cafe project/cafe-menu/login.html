<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0f" />
  <title>Sign In — Cove cafe</title>
  <meta name="description" content="Sign in to your Cove cafe account" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@latest/font/lucide.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #d4a85c;
      --gold-2: #8a6524;
      --gold-light: #e8c896;
      --text: #f5f5f5;
      --text-muted: #a0a0a8;
      --surface: #15151c;
      --surface-alt: #1a1a22;
      --border: rgba(255, 255, 255, 0.1);
      --border-strong: rgba(255, 255, 255, 0.2);
      --bg: #0b0b0f;
      --error: #ff4757;
      --success: #2ed573;
      --font-display: 'Cormorant Garamond', serif;
      --font-body: 'Inter', sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.5;
      overflow: hidden;
    }

    /* Background effects */
    .bg-grain {
      position: fixed;
      inset: 0;
      opacity: 0.03;
      background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="4"/></filter><rect width="200" height="200" fill="%23fff" filter="url(%23n)"/></svg>');
      pointer-events: none;
      z-index: 0;
    }

    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      pointer-events: none;
      z-index: 1;
    }

    .orb-a {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(212,168,92,0.8), transparent);
      top: -200px;
      right: -100px;
      animation: float 15s ease-in-out infinite;
    }

    .orb-b {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(138,101,36,0.6), transparent);
      bottom: -100px;
      left: -50px;
      animation: float 20s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -30px); }
    }

    /* Main container */
    .container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 2;
      overflow-y: auto;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: rgba(21, 21, 28, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 24px;
      animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Logo section */
    .logo-section {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-ring {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, rgba(212,168,92,0.2), rgba(138,101,36,0.1));
      border: 2px solid var(--border-strong);
      border-radius: 50%;
      margin-bottom: 16px;
      animation: rotateIn 0.8s ease-out;
    }

    @keyframes rotateIn {
      from {
        opacity: 0;
        transform: rotate(-30deg);
      }
      to {
        opacity: 1;
        transform: rotate(0);
      }
    }

    .logo-ring img {
      width: 50px;
      height: 50px;
    }

    .heading {
      font-family: var(--font-display);
      font-size: clamp(28px, 6vw, 40px);
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      color: var(--text);
    }

    .heading em {
      color: var(--gold);
      font-style: italic;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      letter-spacing: 0.2px;
    }

    /* Form */
    .form {
      display: grid;
      gap: 20px;
      margin-top: 32px;
    }

    .form-group {
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .form-input {
      position: relative;
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-family: var(--font-body);
      font-size: 15px;
      color: var(--text);
      transition: all 0.3s ease;
      appearance: none;
      -webkit-appearance: none;
    }

    .form-input::placeholder {
      color: transparent;
    }

    .form-input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212, 168, 92, 0.1);
    }

    .form-input:not(:placeholder-shown) {
      background: rgba(255, 255, 255, 0.07);
    }

    .form-label {
      position: absolute;
      left: 16px;
      top: 14px;
      font-size: 15px;
      color: var(--text-muted);
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: left center;
      background: linear-gradient(to right, var(--bg) 0%, var(--bg) 8px, transparent 10%);
      padding: 0 4px;
      margin-left: -4px;
    }

    .form-input:focus ~ .form-label,
    .form-input:not(:placeholder-shown) ~ .form-label {
      top: -8px;
      font-size: 12px;
      color: var(--gold);
      font-weight: 500;
    }

    .form-input.error {
      border-color: var(--error);
      background: rgba(255, 71, 87, 0.05);
    }

    .form-input.error:focus {
      box-shadow: 0 0 0 3px rgba(255, 71, 87, 0.1);
    }

    .error-message {
      font-size: 12px;
      color: var(--error);
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      opacity: 0;
      animation: slideDown 0.2s ease-out forwards;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-input.error ~ .error-message {
      opacity: 1;
    }

    .form-input.success {
      border-color: var(--success);
      background: rgba(46, 213, 115, 0.05);
    }

    /* Submit button */
    .btn-submit {
      position: relative;
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      color: #1a120a;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 8px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      overflow: hidden;
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(212, 168, 92, 0.25);
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-submit.loading {
      pointer-events: none;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(26, 18, 10, 0.3);
      border-top-color: #1a120a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Info section */
    .info-section {
      margin-top: 28px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.6;
    }

    .info-section strong {
      color: var(--gold);
      font-weight: 600;
    }

    /* Success state */
    .success-state {
      display: none;
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .success-state.active {
      display: block;
    }

    .success-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, rgba(46, 213, 115, 0.2), rgba(46, 213, 115, 0.1));
      border: 2px solid var(--success);
      border-radius: 50%;
      margin-bottom: 16px;
      animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .success-icon i {
      font-size: 32px;
      color: var(--success);
    }

    .success-heading {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }

    .success-message {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .form-state {
      display: block;
    }

    .form-state.hidden {
      display: none;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .card {
        padding: 32px 20px;
        border-radius: 20px;
      }

      .heading {
        font-size: 28px;
      }

      .form {
        gap: 18px;
        margin-top: 28px;
      }

      .form-input {
        padding: 12px 14px;
        font-size: 16px;
      }

      .form-label {
        left: 14px;
        top: 12px;
      }

      .form-input:focus ~ .form-label,
      .form-input:not(:placeholder-shown) ~ .form-label {
        top: -10px;
        font-size: 11px;
      }

      .btn-submit {
        min-height: 44px;
        padding: 12px 20px;
        font-size: 14px;
      }

      .logo-ring {
        width: 72px;
        height: 72px;
      }

      .logo-ring img {
        width: 44px;
        height: 44px;
      }
    }

    /* Input number styling */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body>
  <!-- Background effects -->
  <div class="bg-grain" aria-hidden="true"></div>
  <div class="bg-orb orb-a" aria-hidden="true"></div>
  <div class="bg-orb orb-b" aria-hidden="true"></div>

  <!-- Main container -->
  <div class="container">
    <div class="card">
      <!-- Logo section -->
      <div class="logo-section">
        <div class="logo-ring">
          <img src="./assets/logo/logo.svg" alt="Cove cafe logo" />
        </div>
        <h1 class="heading">Welcome <em>back</em></h1>
        <p class="subtitle">Sign in to continue your cafe experience</p>
      </div>

      <!-- Form state -->
      <div class="form-state" id="formState">
        <form class="form" id="loginForm">
          <!-- Full Name field -->
          <div class="form-group">
            <input 
              type="text" 
              id="fullName" 
              class="form-input" 
              placeholder="Full Name"
              autocomplete="name"
              required
              maxlength="50"
            />
            <label for="fullName" class="form-label">Full Name</label>
            <div class="error-message">
              <i class="i-alert-circle" style="width: 14px; height: 14px;"></i>
              <span id="nameError"></span>
            </div>
          </div>

          <!-- Phone field -->
          <div class="form-group">
            <input 
              type="tel" 
              id="phoneNumber" 
              class="form-input" 
              placeholder="Phone Number"
              autocomplete="tel"
              pattern="[0-9]{10}"
              required
              maxlength="10"
              inputmode="numeric"
            />
            <label for="phoneNumber" class="form-label">Phone Number</label>
            <div class="error-message">
              <i class="i-alert-circle" style="width: 14px; height: 14px;"></i>
              <span id="phoneError"></span>
            </div>
          </div>

          <!-- Submit button -->
          <button type="submit" class="btn-submit" id="submitBtn">
            <span id="btnText">Send OTP</span>
            <span class="spinner" id="btnSpinner" style="display: none;"></span>
          </button>
        </form>

        <!-- Info section -->
        <div class="info-section">
          <p>We'll send a <strong>one-time code</strong> to verify your phone number</p>
        </div>
      </div>

      <!-- Success state -->
      <div class="success-state" id="successState">
        <div class="success-icon">
          <i class="i-check"></i>
        </div>
        <h2 class="success-heading">OTP Sent!</h2>
        <p class="success-message" id="successMessage"></p>
        <button type="button" class="btn-submit" id="resetBtn" style="background: rgba(212, 168, 92, 0.15); border: 1px solid var(--border); color: var(--gold); gap: 0;">
          <i class="i-arrow-left" style="width: 18px; height: 18px;"></i> Send Another
        </button>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const fullNameInput = document.getElementById('fullName');
    const phoneInput = document.getElementById('phoneNumber');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const formState = document.getElementById('formState');
    const successState = document.getElementById('successState');
    const successMessage = document.getElementById('successMessage');
    const resetBtn = document.getElementById('resetBtn');

    // Validation functions
    function validateName(name) {
      const trimmed = name.trim();
      if (!trimmed) return { valid: false, error: 'Full name is required' };
      if (trimmed.length < 2) return { valid: false, error: 'Name must be at least 2 characters' };
      if (trimmed.length > 50) return { valid: false, error: 'Name must be less than 50 characters' };
      if (!/^[a-zA-Z\s'-]+$/.test(trimmed)) return { valid: false, error: 'Name contains invalid characters' };
      return { valid: true, error: null };
    }

    function validatePhone(phone) {
      const cleaned = phone.replace(/\D/g, '');
      if (!cleaned) return { valid: false, error: 'Phone number is required' };
      if (cleaned.length !== 10) return { valid: false, error: 'Phone must be 10 digits' };
      if (!/^[6-9]/.test(cleaned)) return { valid: false, error: 'Invalid phone number' };
      return { valid: true, error: null };
    }

    function clearFieldError(input, errorSpan) {
      input.classList.remove('error', 'success');
      errorSpan.textContent = '';
    }

    function showFieldError(input, errorSpan, message) {
      input.classList.add('error');
      input.classList.remove('success');
      errorSpan.textContent = message;
    }

    function showFieldSuccess(input) {
      input.classList.remove('error');
      input.classList.add('success');
    }

    // Real-time validation
    fullNameInput.addEventListener('blur', () => {
      const validation = validateName(fullNameInput.value);
      if (!validation.valid) {
        showFieldError(fullNameInput, document.getElementById('nameError'), validation.error);
      } else {
        showFieldSuccess(fullNameInput);
        clearFieldError(fullNameInput, document.getElementById('nameError'));
      }
    });

    phoneInput.addEventListener('input', (e) => {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length > 10) value = value.slice(0, 10);
      e.target.value = value;
    });

    phoneInput.addEventListener('blur', () => {
      const validation = validatePhone(phoneInput.value);
      if (!validation.valid) {
        showFieldError(phoneInput, document.getElementById('phoneError'), validation.error);
      } else {
        showFieldSuccess(phoneInput);
        clearFieldError(phoneInput, document.getElementById('phoneError'));
      }
    });

    // Form submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Clear previous errors
      clearFieldError(fullNameInput, document.getElementById('nameError'));
      clearFieldError(phoneInput, document.getElementById('phoneError'));

      // Validate
      const nameValidation = validateName(fullNameInput.value);
      const phoneValidation = validatePhone(phoneInput.value);

      if (!nameValidation.valid) {
        showFieldError(fullNameInput, document.getElementById('nameError'), nameValidation.error);
      } else {
        showFieldSuccess(fullNameInput);
      }

      if (!phoneValidation.valid) {
        showFieldError(phoneInput, document.getElementById('phoneError'), phoneValidation.error);
      } else {
        showFieldSuccess(phoneInput);
      }

      if (!nameValidation.valid || !phoneValidation.valid) return;

      // Show loading state
      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline-block';

      try {
        // Simulate OTP sending (replace with actual API call)
        await new Promise(resolve => setTimeout(resolve, 2000));

        // Success
        const phone = phoneInput.value;
        const maskedPhone = `**** **** ${phone.slice(-2)}`;
        successMessage.textContent = `OTP has been sent to +91 ${phone.slice(0, 5)}•••${phone.slice(-2)}`;
        
        formState.classList.add('hidden');
        successState.classList.add('active');
      } catch (error) {
        // Error handling
        showFieldError(phoneInput, document.getElementById('phoneError'), 'Failed to send OTP. Try again.');
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
      }
    });

    // Reset button
    resetBtn.addEventListener('click', () => {
      form.reset();
      fullNameInput.classList.remove('error', 'success');
      phoneInput.classList.remove('error', 'success');
      document.getElementById('nameError').textContent = '';
      document.getElementById('phoneError').textContent = '';
      submitBtn.disabled = false;
      btnText.style.display = 'inline';
      btnSpinner.style.display = 'none';
      
      formState.classList.remove('hidden');
      successState.classList.remove('active');
      
      fullNameInput.focus();
    });

    // Auto-focus
    fullNameInput.focus();
  </script>
</body>
</html>
