<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0B0F" />
  <title>Cove Cafe Menu</title>
  <meta name="description" content="Browse the Cove Cafe menu by category and subcategory." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@latest/font/lucide.css" />
  <link rel="stylesheet" href="./css/menu.css" />
</head>
<body>
  <header class="menu-header">
    <button class="icon-button" id="backButton" type="button" aria-label="Go back">
      <i class="i-arrow-left"></i>
    </button>

    <label class="category-select" aria-label="Category type">
      <select id="categorySelect">
        <option value="">Loading menu...</option>
      </select>
      <i class="i-chevron-down"></i>
    </label>

    <label class="veg-toggle" for="vegOnly">
      <input id="vegOnly" type="checkbox" />
      <span class="toggle-track" aria-hidden="true"><span></span></span>
      <strong>Veg</strong>
    </label>

    <button class="icon-button" id="searchButton" type="button" aria-label="Search menu">
      <i class="i-search"></i>
    </button>

    <a class="icon-button" href="./login.html" aria-label="Profile">
      <i class="i-user"></i>
    </a>
  </header>

  <section class="search-panel" id="searchPanel" hidden>
    <div class="search-box">
      <i class="i-search"></i>
      <input id="searchInput" type="search" placeholder="Search dishes, ingredients, allergens" autocomplete="off" />
      <button id="clearSearch" type="button" aria-label="Clear search" hidden><i class="i-x"></i></button>
    </div>
  </section>

  <nav class="category-strip" aria-label="Menu categories">
    <div class="category-scroll" id="categoryStrip"></div>
  </nav>

  <div class="menu-status" id="menuStatus" role="status">Loading Cove Cafe menu...</div>

  <section class="menu-layout" aria-label="Cafe menu">
    <aside class="subcategory-sidebar" aria-label="Subcategories">
      <div class="subcategory-list" id="subcategoryList"></div>
    </aside>

    <main class="menu-content" id="menuSections" aria-live="polite"></main>
  </section>

  <div class="modal" id="itemModal" hidden>
    <article class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalName">
      <button class="modal-close" id="modalClose" type="button" aria-label="Close">
        <i class="i-x"></i>
      </button>
      <div class="modal-image" id="modalImageWrap">
        <img id="modalImage" alt="" />
      </div>
      <div class="modal-content">
        <div class="modal-title-row">
          <span class="food-dot" id="modalFoodDot" aria-hidden="true"></span>
          <h2 id="modalName"></h2>
          <strong id="modalPrice"></strong>
        </div>
        <div class="modal-badges" id="modalBadges"></div>
        <p id="modalDescription"></p>
        <dl class="detail-list">
          <div>
            <dt>Ingredients</dt>
            <dd id="modalIngredients"></dd>
          </div>
          <div>
            <dt>Allergens</dt>
            <dd id="modalAllergens"></dd>
          </div>
        </dl>
        <a class="whatsapp-button" id="modalOrder" target="_blank" rel="noopener">
          <i class="i-message-circle"></i>
          Order on WhatsApp
        </a>
      </div>
    </article>
  </div>

  <script type="module" src="./js/menu.js"></script>
</body>
</html>
